# Replace canteen.example.edu before enabling. Only ACME is exposed at this stage.
server {
    listen 80;
    listen [::]:80;
    server_name canteen.example.edu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503; }
}
