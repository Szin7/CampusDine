# Loaded inside nginx's http context through sites-enabled.
map $http_upgrade $campusdine_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name canteen.example.edu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://canteen.example.edu$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name canteen.example.edu;
    ssl_certificate /etc/letsencrypt/live/canteen.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canteen.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Trailing slash strips /api/: /api/ws/orders becomes /ws/orders.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This template assumes nginx is the public edge, with no upstream proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campusdine_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
