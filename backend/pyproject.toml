[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campusdine-backend"
version = "0.1.0"
description = "National College of Engineering canteen backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<17",
    "anyio>=4,<5",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "python-dotenv>=1,<2",
    "tzdata>=2024.2",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.18,<1",
    "email-validator>=2,<3",
    "Pillow>=11,<13",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
face = ["face-recognition==1.3.0", "setuptools<81"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
